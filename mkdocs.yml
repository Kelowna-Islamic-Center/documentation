site_name: Kelowna Islamic Center
site_url: https://kelowna-islamic-center.github.io/documentation/

docs_dir: content
site_dir: docs

nav:
  - Project Overview: index.md
  - Application Architecture: application-architecture.md
  - Internationalization: internationalization.md
  - Design Language & Accessibility: design-language.md

  - Server Side:
      - Overview: server-side/index.md
      - Prayer Times API: server-side/prayer-times-api.md
      - Announcements: server-side/announcements.md
      - Development: server-side/development.md
      - Cloud Functions Reference:
        - PrayerTimesFetch: server-side/cloud-functions/prayer-times-fetch.md
        - AnnouncementAlert: server-side/cloud-functions/announcement-alert.md
        - Legacy - PrayerTimesAlertScheduler: server-side/cloud-functions/legacy-prayer-times-alert-scheduler.md
        - Legacy - SendPrayerAlert: server-side/cloud-functions/legacy-send-prayer-alert.md

  - Mobile App:
      - Overview: mobile-app/index.md
      - Application Architecture: mobile-app/application-architecture.md
      - Prayer Alerts: mobile-app/alert-system-overview.md
      - Background Services: mobile-app/background-services.md
      - Development:
        - Installation: mobile-app/development/installation.md
        - Building & Distribution: mobile-app/development/building.md

  - Kiosk App:
      - Overview: kiosk-app/index.md
      - Development: kiosk-app/development.md
      - Kiosk Display Guide: kiosk-app/display-guide.md

theme:
  name: material
  logo: assets/logo.png
  features:
    - navigation.sections
  palette: 
    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: green

# 🔹 Repo link in top bar
repo_url: https://github.com/Kelowna-Islamic-Center
repo_name: View Repos on Github
repo_icon: fontawesome/brands/github

markdown_extensions:
  - admonition
  - codehilite
  - attr_list
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg